name: kpk
description: "Keralappenkavikal Website"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  go_router: ^17.0.0
  intl: ^0.20.2
  google_fonts: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "res/kpk-logo.jpg"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "res/kpk-logo.jpg"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: false
  macos:
    generate: false


flutter:

  uses-material-design: true

  assets:
    - res/kpk-logo.jpg
